<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thay người giữa hiệp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>🔄 Thay Người Chiến Thuật (Còn {{ 3 - subs_used }} lượt)</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Cầu thủ đá chính ra sân (Thể lực đuối):</label>
                <select name="player_out">
                    {% for p in xi %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.position }}) - Thể lực: {{ p.stamina|round(1) }}%</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Cầu thủ dự bị vào sân (Sung sức 100%):</label>
                <select name="player_in">
                    {% for p in subs %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.position }}) - Thể lực: {{ p.stamina|round(1) }}%</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn primary">Xác nhận Thay người</button>
            <a href="{{ url_for('live_match') }}" class="btn secondary mt-2">← Quay lại trận đấu</a>
        </form>
    </div>
</body>
</html>
